services:
  - type: web
    name: cybershield-soc-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false